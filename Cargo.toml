[workspace]
resolver = "3"
members = ["crates/polar-schema", "crates/polar-markdown", "crates/polar-testkit", "crates/polar-core", "crates/polar-store"]
# Throwaway risk probes, deliberately outside the workspace: they pin their own
# deps and must not gate the build.
exclude = ["prototypes/yrs-check", "prototypes/editor-probe/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
polar-schema = { path = "crates/polar-schema" }
polar-testkit = { path = "crates/polar-testkit" }
polar-core = { path = "crates/polar-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
