[workspace]
resolver = "3"
members = ["crates/thought-schema", "crates/thought-markdown", "crates/thought-testkit", "crates/thought-core", "crates/thought-store", "crates/thought-provenance", "crates/thought-mcp", "crates/thoughtd"]
# Throwaway risk probes, deliberately outside the workspace: they pin their own
# deps and must not gate the build.
exclude = ["prototypes/yrs-check", "prototypes/editor-probe/src-tauri", "app/src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
thought-schema = { path = "crates/thought-schema" }
thought-testkit = { path = "crates/thought-testkit" }
thought-core = { path = "crates/thought-core" }
thought-markdown = { path = "crates/thought-markdown" }
thought-store = { path = "crates/thought-store" }
thought-provenance = { path = "crates/thought-provenance" }
thought-mcp = { path = "crates/thought-mcp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
