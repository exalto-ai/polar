<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Polar — Orbit, coin cut. For light grounds. The ring and arm are knocked out, so the ground shows through them. -->
  <defs>
    <mask id="coin">
      <rect width="96" height="96" fill="#fff"/>
      <circle cx="48" cy="48" r="21" fill="none" stroke="#000" stroke-width="4.5"/>
      <line x1="48" y1="48" x2="72" y2="24" stroke="#000" stroke-width="7" stroke-linecap="round"/>
    </mask>
  </defs>
  <circle cx="48" cy="48" r="34" fill="#2f6fed" mask="url(#coin)"/>
</svg>
