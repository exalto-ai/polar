<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0c1622" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proof of Thought</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="chrome" data-tauri-drag-region>
      <span class="presence" id="presence"></span>
      <button class="status" id="status" title="Connections" aria-haspopup="dialog"></button>
    </header>

    <div class="popover" id="connections" hidden role="dialog" aria-label="Connections">
      <section>
        <h2>Windows</h2>
        <ul id="peers"></ul>
        <button class="ghost" id="new-window">Open another window <kbd>⌘N</kbd></button>
      </section>
      <section>
        <h2>Agents</h2>
        <ul id="agents"></ul>
      </section>
      <section>
        <h2>Connect an agent</h2>
        <p class="note">Point any MCP client at this command. It finds the running daemon, or starts one.</p>
        <pre id="stdio-command"></pre>
        <button class="ghost" id="copy-command">Copy</button>
      </section>
    </div>

    <main class="page">
      <div id="editor" class="editor"></div>
    </main>

    <!-- Errors used to have nowhere to go: a failed call left the status dot
         green and the window silently wrong. -->
    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <div class="scrim" id="scrim" hidden>
      <div class="switcher" role="dialog" aria-label="Open document">
        <input id="switcher-input" type="text" placeholder="Search documents…" autocomplete="off" spellcheck="false" />
        <ul id="switcher-results"></ul>
        <div class="switcher-hint" id="switcher-hint"></div>
      </div>
    </div>
  </body>
</html>
