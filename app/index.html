<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polar</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header class="chrome" data-tauri-drag-region>
      <span class="title" id="title">Untitled</span>
      <span class="presence" id="presence"></span>
      <span class="status" id="status" title="offline"></span>
    </header>

    <main class="page">
      <div id="editor" class="editor"></div>
    </main>

    <div class="scrim" id="scrim" hidden>
      <div class="switcher" role="dialog" aria-label="Open document">
        <input id="switcher-input" type="text" placeholder="Search documents…" autocomplete="off" spellcheck="false" />
        <ul id="switcher-results"></ul>
        <div class="switcher-hint"><kbd>↵</kbd> open · <kbd>⌘↵</kbd> new · <kbd>esc</kbd> close</div>
      </div>
    </div>
  </body>
</html>
