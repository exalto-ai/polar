[package]
name = "thought"
version = "0.1.0"
description = "Proof of Thought desktop app"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "thought_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
thoughtd = { path = "../../crates/thoughtd" }
thought-markdown = { path = "../../crates/thought-markdown" }
thought-schema = { path = "../../crates/thought-schema" }
thought-credentials = { path = "../../crates/thought-credentials" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
zeroize = "1"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "system-proxy"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "openbsd", target_os = "netbsd"))'.dependencies]
rfd = { version = "0.16", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSAlert", "NSButton", "NSControl", "NSResponder", "NSSecureTextField", "NSTextField", "NSView", "NSWindow"] }

[dev-dependencies]
tempfile = "3"
