[package]
name = "thoughtd"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "thoughtd"
path = "src/main.rs"

[[bin]]
name = "thought-mcp-stdio"
path = "src/bin/thought-mcp-stdio.rs"

[dependencies]
thought-core = { workspace = true }
thought-credentials = { workspace = true }
thought-mcp = { workspace = true }
thought-store = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { version = "3", features = ["server", "transport-streamable-http-server"] }
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
ureq = { version = "3", features = ["json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tokio-tungstenite = "0.28"
futures-util = "0.3"
thought-core = { workspace = true }
thought-schema = { workspace = true }
ureq = { version = "3", features = ["json"] }
tempfile = "3"
