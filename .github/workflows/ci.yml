name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        # yrs 0.27 uses if-let guards; anything below 1.95 cannot build it.
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

      - name: Property tests, deeper
        # The round-trip property is the one guard on the agent-facing contract
        # (AD-12), so CI runs far more cases than the local default.
        env:
          PROPTEST_CASES: "20000"
        run: cargo test --workspace --test round_trip

  schema:
    # The editor defines the schema and Rust reads a generated copy (M2.2).
    # Drift between them makes agents produce documents the editor rejects — a
    # failure that surfaces late and looks like a CRDT bug, so it is gated here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci --prefix app
      - run: npm run schema:check --prefix app
      - run: npx tsc --noEmit
        working-directory: app
      - run: npm test
        working-directory: app

  tauri:
    # The desktop crate is intentionally outside the Rust workspace. A macOS
    # gate exercises the process, socket, and sidecar checks used by upgrades.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci --prefix app
      - run: npm run build --prefix app
      - name: Stage host sidecars for Tauri
        run: ./scripts/stage-sidecars.sh "$(rustc -vV | awk '/^host:/ { print $2 }')"
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets --locked
      - run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked
