name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        # yrs 0.27 uses if-let guards; anything below 1.95 cannot build it.
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

      - name: Property tests, deeper
        # The round-trip property is the one guard on the agent-facing contract
        # (AD-12), so CI runs far more cases than the local default.
        env:
          PROPTEST_CASES: "20000"
        run: cargo test --workspace --test round_trip
