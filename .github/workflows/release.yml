name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Creates a draft release."
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      TARGET: universal-apple-darwin
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Signing is all-or-nothing: without a certificate the build is unsigned,
      # and an unsigned build cannot be notarized either.
      SIGN: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify release tag and checkout
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a supported version tag such as v0.1.0."
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "::error::Release tag '$TAG' does not exist."
            exit 1
          }
          tag_commit="$(git rev-parse "${TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::Checked-out commit $head_commit does not match $TAG at $tag_commit."
            exit 1
          fi

      - name: Validate Apple release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_KEY_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_BASE64 }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: |
          set -euo pipefail
          credential_names=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_TEAM_ID
            APPLE_NOTARIZATION_KEY_BASE64
            APPLE_NOTARIZATION_KEY_ID
            APPLE_NOTARIZATION_ISSUER_ID
          )
          configured=0
          missing=()
          for name in "${credential_names[@]}"; do
            if [ -n "${!name}" ]; then
              configured=$((configured + 1))
            else
              missing+=("$name")
            fi
          done

          total="${#credential_names[@]}"
          if (( configured == 0 )); then
            echo "No Apple credentials are configured. This run will produce an unsigned build."
          elif (( configured != total )); then
            echo "::error::Apple signing and notarization credentials must be configured together."
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          elif [ "$SIGN" != "true" ]; then
            echo "::error::Credential state disagrees with the signing mode."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: npm ci --prefix app

      # The window cannot reach a document without the daemon, so both binaries
      # ship inside the bundle as sidecars.
      - name: Build the daemon and shim
        run: ./scripts/stage-sidecars.sh "$TARGET"

      - name: Import Developer ID certificate
        if: env.SIGN == 'true'
        uses: apple-actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # An App Store Connect API key rather than an Apple ID and app-specific
      # password: three values, no second factor, and nothing that expires when
      # someone changes their Apple ID password.
      - name: Prepare App Store Connect API key
        if: env.SIGN == 'true'
        env:
          KEY_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"

          # Fail here with a clear reason rather than eight minutes later with
          # "invalidPEMDocument" from inside the bundler. `op item get --fields`
          # CSV-quotes multi-line values, so a key exported that way decodes to
          # a PEM wrapped in double quotes and is rejected — which is exactly
          # how this broke the first time.
          if ! openssl pkey -in "$key_path" -noout 2>/dev/null; then
            echo "::error::The decoded notarization key is not a valid PEM."
            echo "Re-export it unquoted; see docs/releasing.md."
            exit 1
          fi
          echo "Notarization key: valid PEM, $(wc -c < "$key_path") bytes"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed bundle
        if: env.SIGN == 'true'
        working-directory: app
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm exec -- tauri build --target "$TARGET" --bundles app,dmg --ci -- --locked

      - name: Build unsigned bundle
        if: env.SIGN != 'true'
        working-directory: app
        run: npm exec -- tauri build --target "$TARGET" --bundles app,dmg --no-sign --ci -- --locked

      # Tauri names the disk image after `productName`, which now contains
      # spaces, and a download URL would carry them as %20. The convention every
      # multi-word Mac app follows is spaces in the `.app` and none in the
      # artifact: "Visual Studio Code.app" ships as VSCode-darwin-universal.zip,
      # "Android Studio.app" as android-studio-*.dmg. Renamed before notarizing
      # so the ticket is stapled to the file that is actually distributed.
      - name: Give the disk image a space-free name
        run: |
          set -euo pipefail
          dmg=$(find "app/src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          renamed="$(dirname "$dmg")/ProofOfThought_${TAG#v}_${TARGET%%-*}.dmg"
          mv "$dmg" "$renamed"
          echo "$(basename "$dmg") -> $(basename "$renamed")"

      # Tauri notarizes and staples the *application* before wrapping it in a
      # disk image. The DMG is a separately distributed container and needs its
      # own ticket, or Gatekeeper rejects the download even though the app
      # inside it is fine.
      - name: Notarize and staple the DMG
        if: env.SIGN == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        run: |
          set -euo pipefail
          dmg=$(find "app/src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"

      - name: Verify the bundle
        env:
          EXPECTED_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg=$(find "app/src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil verify "$dmg"

          # The failure a release is most likely to have: a window with no
          # daemon beside it.
          app="app/src-tauri/target/$TARGET/release/bundle/macos/Proof of Thought.app"
          for binary in thought thoughtd thought-mcp-stdio; do
            test -x "$app/Contents/MacOS/$binary" || {
              echo "::error::$binary is missing from the bundle"
              exit 1
            }
          done
          for binary in thought thoughtd thought-mcp-stdio; do
            lipo "$app/Contents/MacOS/$binary" -verify_arch arm64 x86_64 || {
              echo "::error::$binary is not a universal arm64 and x86_64 binary"
              exit 1
            }
          done

          test "$(codesign -dvv "$app/Contents/MacOS/thoughtd" 2>&1 | sed -n 's/^Identifier=//p')" = \
            "ai.exalto.thought.thoughtd"
          test "$(codesign -dvv "$app/Contents/MacOS/thought-mcp-stdio" 2>&1 | sed -n 's/^Identifier=//p')" = \
            "ai.exalto.thought.thought-mcp-stdio"

          if [ "$SIGN" = "true" ]; then
            # The Keychain ACL tracks each helper's designated requirement.
            # Stable identifiers keep existing reviewer connections usable
            # after updates, while the signing identity prevents spoofing.
            app_team="$(codesign -dvv "$app/Contents/MacOS/thought" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
            if [ -z "$EXPECTED_APPLE_TEAM_ID" ] || [ "$app_team" != "$EXPECTED_APPLE_TEAM_ID" ]; then
              echo "::error::The app is not signed by the configured Apple team."
              exit 1
            fi
            for binary in thoughtd thought-mcp-stdio; do
              binary_path="$app/Contents/MacOS/$binary"
              helper_team="$(codesign -dvv "$binary_path" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
              if [ "$helper_team" != "$EXPECTED_APPLE_TEAM_ID" ]; then
                echo "::error::$binary is not signed by the configured Apple team."
                exit 1
              fi
              requirement="$(codesign -d -r- "$binary_path" 2>&1)"
              case "$requirement" in
                *cdhash*)
                  echo "::error::$binary has a version-specific designated requirement"
                  exit 1
                  ;;
              esac
              case "$requirement" in
                *"anchor apple generic"*) ;;
                *)
                  echo "::error::$binary does not have an Apple Developer ID designated requirement"
                  exit 1
                  ;;
              esac
              case "$requirement" in
                *"subject.OU"*"$EXPECTED_APPLE_TEAM_ID"*) ;;
                *)
                  echo "::error::$binary designated requirement is not bound to the configured Apple team"
                  exit 1
                  ;;
              esac
            done
            codesign --verify --deep --strict --verbose=2 "$app"

            # What a downloading user's machine will conclude.
            spctl -a -t open --context context:primary-signature -v "$dmg"
          fi

          mkdir -p release
          cp "$dmg" release/
          (cd release && shasum -a 256 *.dmg > SHA256SUMS)
          ls -la release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(cat <<'NOTES'
          A local-first writing app where people and agents edit the same documents.

          Download the `.dmg`, drag Proof of Thought to Applications, and open it. The daemon
          ships inside the bundle and starts on first launch.
          NOTES
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --draft --title "Proof of Thought $TAG" --notes "$notes"
          fi
