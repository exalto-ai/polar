name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Creates a draft release."
        required: true

jobs:
  macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: npm ci --prefix app

      # The window is useless without the daemon, so both binaries are built
      # for both architectures and stitched into the bundle as sidecars.
      - name: Build the daemon and shim
        run: ./scripts/stage-sidecars.sh universal-apple-darwin

      # An unset secret still resolves to an empty string, and Tauri treats a
      # present-but-empty APPLE_CERTIFICATE as "sign this", then fails trying to
      # import an empty certificate. Writing to $GITHUB_ENV only when the values
      # exist keeps them genuinely absent otherwise, so one build step covers
      # both cases.
      - name: Configure signing, if it is configured
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ]; then
            echo "No Apple signing secrets set — building unsigned."
            echo "Gatekeeper will warn on first open; see docs/releasing.md."
            exit 0
          fi

          # The delimiter form, because a base64 certificate is many lines.
          {
            echo "APPLE_CERTIFICATE<<POLAR_EOF"
            echo "$CERT"
            echo "POLAR_EOF"
          } >> "$GITHUB_ENV"

          echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "Signing as: $IDENTITY"

      - name: Build and bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Polar ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            A local-first writing app where people and agents edit the same
            documents.

            Download the `.dmg`, drag Polar to Applications, and open it. The
            daemon ships inside the bundle and starts on first launch.
          # Draft, so the DMG can be opened and checked before anyone gets it.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin
