name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Creates a draft release."
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release-ref:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Verify trusted release tag
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a supported version tag such as v0.1.0."
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "::error::Release tag '$TAG' does not exist."
            exit 1
          }
          tag_commit="$(git rev-parse "${TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error::Checked-out commit $head_commit does not match $TAG at $tag_commit."
            exit 1
          fi
          compare_status=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/${tag_commit}...main" \
            --jq '.status')
          if [ "$compare_status" != "ahead" ] && [ "$compare_status" != "identical" ]; then
            echo "::error::Release tag $TAG is not contained in origin/main."
            exit 1
          fi
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"

  macos:
    needs: release-ref
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.release-artifact.outputs.name }}
    env:
      TARGET: universal-apple-darwin
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Signing is all-or-nothing: without a certificate the build is unsigned,
      # and an unsigned build cannot be notarized either.
      SIGN: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.release-ref.outputs.commit }}

      - name: Recheck approved release checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse HEAD)"
          approved_commit="${{ needs.release-ref.outputs.commit }}"
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq '.sha')
          compare_status=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/${approved_commit}...main" \
            --jq '.status')
          if [ "$head_commit" != "$tag_commit" ] || [ "$head_commit" != "$approved_commit" ]; then
            echo "::error::The approved release commit changed before the protected job."
            exit 1
          fi
          if [ "$compare_status" != "ahead" ] && [ "$compare_status" != "identical" ]; then
            echo "::error::The approved release commit is no longer contained in main."
            exit 1
          fi

      - name: Validate Apple release credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_NOTARIZATION_KEY_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_BASE64 }}
          APPLE_NOTARIZATION_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_NOTARIZATION_ISSUER_ID: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: |
          set -euo pipefail
          credential_names=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_TEAM_ID
            APPLE_NOTARIZATION_KEY_BASE64
            APPLE_NOTARIZATION_KEY_ID
            APPLE_NOTARIZATION_ISSUER_ID
          )
          configured=0
          missing=()
          for name in "${credential_names[@]}"; do
            if [ -n "${!name}" ]; then
              configured=$((configured + 1))
            else
              missing+=("$name")
            fi
          done

          total="${#credential_names[@]}"
          if (( configured == 0 )); then
            echo "No Apple credentials are configured. This run will produce an unsigned build."
          elif (( configured != total )); then
            echo "::error::Apple signing and notarization credentials must be configured together."
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          elif [ "$SIGN" != "true" ]; then
            echo "::error::Credential state disagrees with the signing mode."
            exit 1
          elif [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID must be a 10-character Apple team identifier."
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: npm ci --prefix app

      # The window cannot reach a document without the daemon, so both binaries
      # ship inside the bundle as sidecars.
      - name: Build the daemon and shim
        run: ./scripts/stage-sidecars.sh "$TARGET"

      - name: Import Developer ID certificate
        if: env.SIGN == 'true'
        uses: apple-actions/import-codesign-certs@95e84a1a18f2bdbc5c6ab9b7f4429372e4b13a8b # v5
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # An App Store Connect API key rather than an Apple ID and app-specific
      # password: three values, no second factor, and nothing that expires when
      # someone changes their Apple ID password.
      - name: Prepare App Store Connect API key
        if: env.SIGN == 'true'
        env:
          KEY_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"

          # Fail here with a clear reason rather than eight minutes later with
          # "invalidPEMDocument" from inside the bundler. `op item get --fields`
          # CSV-quotes multi-line values, so a key exported that way decodes to
          # a PEM wrapped in double quotes and is rejected — which is exactly
          # how this broke the first time.
          if ! openssl pkey -in "$key_path" -noout 2>/dev/null; then
            echo "::error::The decoded notarization key is not a valid PEM."
            echo "Re-export it unquoted; see docs/releasing.md."
            exit 1
          fi
          echo "Notarization key: valid PEM, $(wc -c < "$key_path") bytes"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed bundle
        if: env.SIGN == 'true'
        working-directory: app
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm exec -- tauri build --target "$TARGET" --bundles app,dmg --ci -- --locked

      - name: Build unsigned bundle
        if: env.SIGN != 'true'
        working-directory: app
        run: npm exec -- tauri build --target "$TARGET" --bundles app,dmg --no-sign --ci -- --locked

      # Tauri names the disk image after `productName`, which now contains
      # spaces, and a download URL would carry them as %20. The convention every
      # multi-word Mac app follows is spaces in the `.app` and none in the
      # artifact: "Visual Studio Code.app" ships as VSCode-darwin-universal.zip,
      # "Android Studio.app" as android-studio-*.dmg. Renamed before notarizing
      # so the ticket is stapled to the file that is actually distributed.
      - name: Give the disk image a space-free name
        run: |
          set -euo pipefail
          dmg=$(find "app/src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          suffix=""
          if [ "$SIGN" != "true" ]; then
            suffix="_unsigned"
          fi
          renamed="$(dirname "$dmg")/ProofOfThought_${TAG#v}_${TARGET%%-*}${suffix}.dmg"
          mv "$dmg" "$renamed"
          echo "$(basename "$dmg") -> $(basename "$renamed")"

      # Tauri notarizes and staples the *application* before wrapping it in a
      # disk image. The DMG is a separately distributed container and needs its
      # own ticket, or Gatekeeper rejects the download even though the app
      # inside it is fine.
      - name: Notarize and staple the DMG
        if: env.SIGN == 'true'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        run: |
          set -euo pipefail
          dmg=$(find "app/src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"

      - name: Verify the bundle
        run: |
          set -euo pipefail
          dmg=$(find "app/src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil verify "$dmg"

          mount_point="$RUNNER_TEMP/thought-release-mount"
          mkdir -p "$mount_point"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount_point" "$dmg"
          cleanup_mount() { hdiutil detach "$mount_point" >/dev/null; }
          trap cleanup_mount EXIT

          # Inspect the copy people will install, not only Tauri's source bundle.
          app="$mount_point/Proof of Thought.app"
          bundle_version=$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")
          if [ "$TAG" != "v$bundle_version" ]; then
            echo "::error::Release tag $TAG does not match app version $bundle_version."
            exit 1
          fi
          for binary in thought thoughtd thought-mcp-stdio; do
            test -x "$app/Contents/MacOS/$binary" || {
              echo "::error::$binary is missing from the bundle"
              exit 1
            }
          done
          cmp THIRD_PARTY_NOTICES.md "$app/Contents/Resources/THIRD_PARTY_NOTICES.md" || {
            echo "::error::The packaged third-party notices do not match the reviewed source."
            exit 1
          }
          for binary in thought thoughtd thought-mcp-stdio; do
            lipo "$app/Contents/MacOS/$binary" -verify_arch arm64 x86_64 || {
              echo "::error::$binary is not a universal arm64 and x86_64 binary"
              exit 1
            }
          done

          if [ "$SIGN" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl -a -t exec -vv "$app"

            # What a downloading user's machine will conclude.
            spctl -a -t open --context context:primary-signature -v "$dmg"
          fi

          hdiutil detach "$mount_point"
          trap - EXIT

          mkdir -p release
          cp "$dmg" release/
          (cd release && shasum -a 256 *.dmg > SHA256SUMS)
          ls -la release

      - name: Name verified release candidate
        id: release-artifact
        run: echo "name=proof-of-thought-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload verified release candidate
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.release-artifact.outputs.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: [release-ref, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: ${{ needs.macos.outputs.artifact-name }}
          path: release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVED_COMMIT: ${{ needs.release-ref.outputs.commit }}
        run: |
          set -euo pipefail
          dmg_count=$(find release -maxdepth 1 -type f -name '*.dmg' | wc -l | tr -d ' ')
          if [ "$dmg_count" != "1" ] || [ ! -f release/SHA256SUMS ]; then
            echo "::error::The verified release artifact must contain one DMG and SHA256SUMS."
            exit 1
          fi
          (cd release && shasum -a 256 -c SHA256SUMS)
          dmg=$(find release -maxdepth 1 -type f -name '*.dmg' -print -quit)
          case "$dmg" in
            *_unsigned.dmg) signed=false ;;
            *) signed=true ;;
          esac

          if [ "$signed" = "true" ]; then
            notes=$(cat <<'NOTES'
          A local-first writing app where AI reviewers suggest changes for a person to accept.

          This draft candidate is signed and notarized. Download the `.dmg`, drag Proof of Thought
          to Applications, and open it. The daemon ships inside the bundle and starts on first launch.
          NOTES
            )
          else
            notes=$(cat <<'NOTES'
          A local-first writing app where AI reviewers suggest changes for a person to accept.

          Developer test build only. The `_unsigned.dmg` is not signed or notarized. Do not publish
          this draft candidate.
          NOTES
            )
          fi

          remote_tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/tags/$TAG" --jq '.sha')
          if [ "$remote_tag_commit" != "$APPROVED_COMMIT" ]; then
            echo "::error::Release tag $TAG moved after approval."
            exit 1
          fi
          compare_status=$(gh api \
            "repos/$GITHUB_REPOSITORY/compare/${APPROVED_COMMIT}...main" \
            --jq '.status')
          if [ "$compare_status" != "ahead" ] && [ "$compare_status" != "identical" ]; then
            echo "::error::The approved release commit is no longer contained in main."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft=$(gh release view "$TAG" --json isDraft --jq '.isDraft')
            if [ "$is_draft" != "true" ]; then
              echo "::error::Refusing to replace assets on published release $TAG."
              exit 1
            fi
            for asset in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              case "$asset" in
                ProofOfThought_*.dmg|SHA256SUMS) gh release delete-asset "$TAG" "$asset" --yes ;;
              esac
            done
            gh release edit "$TAG" --title "Proof of Thought $TAG" --notes "$notes"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --draft --title "Proof of Thought $TAG" --notes "$notes"
          fi
