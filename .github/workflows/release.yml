name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0). Creates a draft release."
        required: true

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      TARGET: universal-apple-darwin
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Signing is all-or-nothing: without a certificate the build is unsigned,
      # and an unsigned build cannot be notarized either.
      SIGN: ${{ secrets.APPLE_CERTIFICATE != '' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - run: npm ci --prefix app

      # The window cannot reach a document without the daemon, so both binaries
      # ship inside the bundle as sidecars.
      - name: Build the daemon and shim
        run: ./scripts/stage-sidecars.sh "$TARGET"

      - name: Import Developer ID certificate
        if: env.SIGN == 'true'
        uses: apple-actions/import-codesign-certs@v5
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # An App Store Connect API key rather than an Apple ID and app-specific
      # password: three values, no second factor, and nothing that expires when
      # someone changes their Apple ID password.
      - name: Prepare App Store Connect API key
        if: env.SIGN == 'true'
        env:
          KEY_BASE64: ${{ secrets.APPLE_NOTARIZATION_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "$KEY_BASE64" ]; then
            echo "::warning::APPLE_NOTARIZATION_KEY_BASE64 is not set — the build will be signed but not notarized, and macOS will still refuse to open it on download."
            exit 0
          fi
          key_path="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"

          # Fail here with a clear reason rather than eight minutes later with
          # "invalidPEMDocument" from inside the bundler. `op item get --fields`
          # CSV-quotes multi-line values, so a key exported that way decodes to
          # a PEM wrapped in double quotes and is rejected — which is exactly
          # how this broke the first time.
          if ! openssl pkey -in "$key_path" -noout 2>/dev/null; then
            echo "::error::The decoded notarization key is not a valid PEM."
            echo "First bytes: $(head -c 30 "$key_path" | tr -d '\n')"
            echo "Re-export it unquoted; see docs/releasing.md."
            exit 1
          fi
          echo "Notarization key: valid PEM, $(wc -c < "$key_path") bytes"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build signed bundle
        if: env.SIGN == 'true'
        working-directory: app
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm exec -- tauri build --target "$TARGET" --bundles app,dmg --ci

      - name: Build unsigned bundle
        if: env.SIGN != 'true'
        working-directory: app
        run: npm exec -- tauri build --target "$TARGET" --bundles app,dmg --no-sign --ci

      # Tauri notarizes and staples the *application* before wrapping it in a
      # disk image. The DMG is a separately distributed container and needs its
      # own ticket, or Gatekeeper rejects the download even though the app
      # inside it is fine.
      - name: Notarize and staple the DMG
        if: env.SIGN == 'true' && env.APPLE_API_KEY_PATH != ''
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
        run: |
          set -euo pipefail
          dmg=$(find "app/src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "$dmg"

      - name: Verify the bundle
        run: |
          set -euo pipefail
          dmg=$(find "app/src-tauri/target/$TARGET/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)
          test -n "$dmg"
          hdiutil verify "$dmg"

          # The failure a release is most likely to have: a window with no
          # daemon beside it.
          app="app/src-tauri/target/$TARGET/release/bundle/macos/Polar.app"
          for binary in polard polar-mcp-stdio; do
            test -x "$app/Contents/MacOS/$binary" || {
              echo "::error::$binary is missing from the bundle"
              exit 1
            }
          done
          lipo -archs "$app/Contents/MacOS/polard"

          if [ "$SIGN" = "true" ]; then
            # What a downloading user's machine will conclude.
            spctl -a -t open --context context:primary-signature -v "$dmg"
          fi

          mkdir -p release
          cp "$dmg" release/
          (cd release && shasum -a 256 *.dmg > SHA256SUMS)
          ls -la release

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes=$(cat <<'NOTES'
          A local-first writing app where people and agents edit the same documents.

          Download the `.dmg`, drag Polar to Applications, and open it. The daemon
          ships inside the bundle and starts on first launch.
          NOTES
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --draft --title "Polar $TAG" --notes "$notes"
          fi
