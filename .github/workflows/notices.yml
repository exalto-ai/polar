name: Notices

on:
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "app/package.json"
      - "app/package-lock.json"
      - "app/scripts/generate-notices.mjs"
      - "app/src-tauri/Cargo.lock"
      - "app/src-tauri/Cargo.toml"
      - "third_party/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/notices.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**/Cargo.toml"
      - "app/package.json"
      - "app/package-lock.json"
      - "app/scripts/generate-notices.mjs"
      - "app/src-tauri/Cargo.lock"
      - "app/src-tauri/Cargo.toml"
      - "third_party/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/notices.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install cargo-about
        uses: taiki-e/install-action@394bb5ddf8b2bba382638dadf8c93ff59b9b3fb5 # v2.86.5
        with:
          tool: cargo-about@0.9.2
          fallback: none

      - run: npm ci --prefix app
      - name: Fetch the locked native app graph
        run: |
          cargo fetch --locked --manifest-path app/src-tauri/Cargo.toml
          cargo fetch --locked --target aarch64-apple-darwin --manifest-path app/src-tauri/Cargo.toml
          cargo fetch --locked --target x86_64-apple-darwin --manifest-path app/src-tauri/Cargo.toml
      - run: npm run notices:check --prefix app
